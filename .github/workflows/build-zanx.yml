name: Build ZanX OS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            unzip \
            ca-certificates

      - name: Build ZanX OS
        run: |
          cd ZanX-OS
          chmod +x build-zanx.sh
          sudo ./build-zanx.sh

      - name: Find ISO
        run: |
          find . -type f -name "*.iso" -print

      - name: Upload ZanX ISO
        uses: actions/upload-artifact@v4
        with:
          name: ZanX-OS-ISO
          path: |
            ZanX-OS/dist/*.iso
            ZanX-OS/*.iso
          if-no-files-found: error
